<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544.70661 302.91098">
<!-- DualSense Edge 背面视图
     依据 Sony 官方零件图（Rear）绘制：两个穹顶背键在背部中段左右，
     中间是 RELEASE 释放扣与 RESET 孔，上方两侧是 L2/R2 行程限位滑块。
     图纸是示意图，不追求照片级细节，但位置与相对大小与实物一致。 -->
<g class="edge-rear" data-model="edge-rear">
  <!-- 机身轮廓：上宽下分叉，两侧握把 -->
  <path class="bd" d="M 272,28 C 376,28 452,38 484,64 C 508,84 516,120 508,152 C 500,190 482,224 462,254 C 446,280 430,300 408,300 C 390,300 378,286 372,264 C 364,232 356,214 348,206 C 324,222 300,232 272,232 C 244,232 220,222 196,206 C 188,214 180,232 172,264 C 166,286 154,300 136,300 C 114,300 98,280 82,254 C 62,224 44,190 36,152 C 28,120 36,84 60,64 C 92,38 168,28 272,28 Z"/>
  <!-- 背部中央隆起（电池仓/握持区） -->
  <path class="ln" d="M 128,150 C 168,132 376,132 416,150 C 434,158 436,178 424,194 C 396,214 342,222 272,222 C 202,222 148,214 120,194 C 108,178 110,158 128,150 Z" opacity="0.5"/>
  <!-- L2 / R2 行程限位滑块 -->
  <g data-part="trigger-stop-l">
    <rect class="dk" x="122" y="58" width="20" height="34" rx="9"/>
    <rect class="ln" x="129" y="66" width="6" height="18" rx="3"/>
  </g>
  <g data-part="trigger-stop-r">
    <rect class="dk" x="402" y="58" width="20" height="34" rx="9"/>
    <rect class="ln" x="409" y="66" width="6" height="18" rx="3"/>
  </g>
  <!-- 背键（穹顶面 + 防滑纹）：真实位置在背部中段左右 -->
  <g data-part="paddle-l">
    <circle class="cap edge-control" cx="163" cy="152" r="27"/>
    <circle class="ln" cx="163" cy="152" r="18" opacity="0.65"/>
    <path class="ln" d="M 148,142 L 178,162 M 148,152 L 178,172 M 148,132 L 178,152" opacity="0.45"/>
    <text x="163" y="157">L4</text>
  </g>
  <g data-part="paddle-r">
    <circle class="cap edge-control" cx="381" cy="152" r="27"/>
    <circle class="ln" cx="381" cy="152" r="18" opacity="0.65"/>
    <path class="ln" d="M 366,142 L 396,162 M 366,152 L 396,172 M 366,132 L 396,152" opacity="0.45"/>
    <text x="381" y="157">R4</text>
  </g>
  <!-- 中央：RESET 孔 + RELEASE 释放扣（向下拉可拆摇杆模块） -->
  <g data-part="rear-reset">
    <circle class="dk" cx="272" cy="176" r="5"/>
    <circle class="ln" cx="272" cy="176" r="2"/>
  </g>
  <g data-part="rear-release">
    <rect class="dk" x="243" y="192" width="58" height="18" rx="9"/>
    <text x="272" y="205">RELEASE</text>
  </g>
  <!-- 握把防滑纹（示意） -->
  <path class="ln" d="M 96,232 C 104,248 112,262 120,274" opacity="0.35"/>
  <path class="ln" d="M 424,274 C 432,262 440,248 448,232" opacity="0.35"/>
</g>
</svg>
